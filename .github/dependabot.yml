version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-and-kotlin:
        patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
          - "com.android.*"
          - "com.google.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
