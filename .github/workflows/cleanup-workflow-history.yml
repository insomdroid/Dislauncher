name: Temporary Workflow History Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: 'Permanently delete workflow runs older than the 3 newest runs of each workflow'
        type: boolean
        required: true
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    if: inputs.confirm_cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Keep the 3 newest runs for every workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A workflow_counts=()
          total=0
          kept=0
          deleted=0
          skipped_active=0
          failed=0

          echo "Loading all workflow runs (including failed and cancelled runs)..."

          while IFS=$'\t' read -r run_id workflow_id workflow_name status; do
            [[ -n "${run_id}" && -n "${workflow_id}" ]] || continue
            total=$((total + 1))

            count="${workflow_counts[${workflow_id}]:-0}"
            count=$((count + 1))
            workflow_counts["${workflow_id}"]="${count}"

            if (( count <= 3 )); then
              kept=$((kept + 1))
              echo "KEEP [${count}/3] workflow='${workflow_name}' run=${run_id} status=${status}"
              continue
            fi

            if [[ "${status}" != "completed" ]]; then
              skipped_active=$((skipped_active + 1))
              echo "SKIP workflow='${workflow_name}' run=${run_id}: status is ${status}, not completed"
              continue
            fi

            echo "DELETE workflow='${workflow_name}' run=${run_id} (older than the 3 newest)"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::error::GitHub rejected deletion of run ${run_id}. Check the HTTP error above and the Actions permissions."
            fi
          done < <(
            gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .workflow_id, .name, .status] | @tsv'
          )

          echo ""
          echo "Cleanup summary:"
          echo "  Runs scanned: ${total}"
          echo "  Newest runs retained: ${kept}"
          echo "  Older completed runs deleted: ${deleted}"
          echo "  Older active runs skipped: ${skipped_active}"
          echo "  Deletion failures: ${failed}"

          if (( failed > 0 )); then
            echo "::error::Cleanup incomplete: ${failed} run(s) could not be deleted."
            exit 1
          fi
