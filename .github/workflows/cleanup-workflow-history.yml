name: Temporary Workflow History Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: 'Permanently delete completed workflow runs except the 3 newest completed runs in this repository'
        type: boolean
        required: true
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    if: inputs.confirm_cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Keep the 3 newest completed runs across the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          runs_file="$(mktemp)"
          trap 'rm -f "${runs_file}"' EXIT

          scanned=0
          completed=0
          kept=0
          deleted=0
          active=0
          failed=0

          echo "Loading all workflow runs, newest first..."

          gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .status, .created_at] | @tsv' > "${runs_file}"

          while IFS=$'\t' read -r run_id workflow_name status created_at; do
            [[ -n "${run_id}" ]] || continue
            scanned=$((scanned + 1))

            if [[ "${status}" != "completed" ]]; then
              active=$((active + 1))
              echo "LEAVE ACTIVE workflow='${workflow_name}' run=${run_id} status=${status}"
              continue
            fi

            completed=$((completed + 1))

            if (( completed <= 3 )); then
              kept=$((kept + 1))
              echo "KEEP [${completed}/3] workflow='${workflow_name}' run=${run_id} created_at=${created_at}"
              continue
            fi

            echo "DELETE completed run workflow='${workflow_name}' run=${run_id} created_at=${created_at}"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::error::GitHub rejected deletion of completed run ${run_id}. Check the HTTP error above and the Actions permissions."
            fi
          done < "${runs_file}"

          echo ""
          echo "Repository-wide cleanup summary:"
          echo "  Runs scanned: ${scanned}"
          echo "  Completed runs found: ${completed}"
          echo "  Newest completed runs retained: ${kept}"
          echo "  Older completed runs deleted: ${deleted}"
          echo "  Active runs left untouched: ${active}"
          echo "  Deletion failures: ${failed}"

          if (( failed > 0 )); then
            echo "::error::Cleanup incomplete: ${failed} completed run(s) could not be deleted."
            exit 1
          fi
