name: Temporary Workflow History Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: 'Permanently delete all workflow runs except the 3 newest runs in this repository'
        type: boolean
        required: true
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    if: inputs.confirm_cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the 3 newest runs in the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          runs_file="$(mktemp)"
          trap 'rm -f "${runs_file}"' EXIT

          total=0
          kept=0
          deleted=0
          skipped_active=0
          failed=0

          echo "Loading every workflow run in the repository, newest first..."

          gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .status, .created_at] | @tsv' > "${runs_file}"

          while IFS=$'\t' read -r run_id workflow_name status created_at; do
            [[ -n "${run_id}" ]] || continue
            total=$((total + 1))

            if (( total <= 3 )); then
              kept=$((kept + 1))
              echo "KEEP [${total}/3] workflow='${workflow_name}' run=${run_id} status=${status} created_at=${created_at}"
              continue
            fi

            if [[ "${status}" != "completed" ]]; then
              skipped_active=$((skipped_active + 1))
              echo "SKIP workflow='${workflow_name}' run=${run_id}: status is ${status}, not completed"
              continue
            fi

            echo "DELETE workflow='${workflow_name}' run=${run_id} created_at=${created_at}"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::error::GitHub rejected deletion of run ${run_id}. Check the HTTP error above and the Actions permissions."
            fi
          done < "${runs_file}"

          echo ""
          echo "Repository-wide cleanup summary:"
          echo "  Runs scanned: ${total}"
          echo "  Newest runs retained across ALL workflows: ${kept}"
          echo "  Older completed runs deleted: ${deleted}"
          echo "  Older active runs skipped: ${skipped_active}"
          echo "  Deletion failures: ${failed}"

          if (( failed > 0 )); then
            echo "::error::Cleanup incomplete: ${failed} run(s) could not be deleted."
            exit 1
          fi
