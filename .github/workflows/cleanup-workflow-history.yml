name: Temporary Workflow History Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: 'Confirm permanent deletion of completed workflow run history'
        type: boolean
        required: true
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    if: inputs.confirm_cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')
          echo "Found ${#ids[@]} completed workflow runs."
          deleted=0
          failed=0
          for id in "${ids[@]}"; do
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
              echo "Deleted run ${id}"
            else
              failed=$((failed + 1))
              echo "::warning::Failed to delete run ${id}"
            fi
          done
          echo "Summary: deleted=${deleted}, failed=${failed}"
          test "${failed}" -eq 0
