name: Temp cleanup old build runs

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: "Delete completed Build APK runs older than the 3 newest runs?"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep the 3 newest Build APK runs
    if: inputs.confirm_delete == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older completed Build APK runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = "build-apk.yml";
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                per_page: 100
              }
            );

            runs.sort((a, b) =>
              b.run_number - a.run_number ||
              Date.parse(b.created_at) - Date.parse(a.created_at)
            );

            const keep = new Set(runs.slice(0, 3).map(run => run.id));
            const candidates = runs.filter(run =>
              !keep.has(run.id) && run.status === "completed"
            );

            core.info(`Found ${runs.length} Build APK runs.`);
            core.info(`Keeping newest run IDs: ${runs.slice(0, 3).map(run => run.id).join(", ")}`);
            core.info(`Deleting ${candidates.length} older completed runs; in-progress runs are never deleted.`);

            for (const run of candidates) {
              core.info(`Deleting run #${run.run_number} (ID ${run.id}, conclusion: ${run.conclusion})`);
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }

            core.info("Cleanup finished.");
