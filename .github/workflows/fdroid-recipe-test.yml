name: F-Droid recipe smoke test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'docs/fdroiddata/metadata/**'
      - '.github/workflows/fdroid-recipe-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-recipe-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-build:
    name: Build the pinned F-Droid recipe source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read and checkout the recipe commit
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          RECIPE_COMMIT="$(ruby -ryaml -e 'puts YAML.load_file("docs/fdroiddata/metadata/com.insomdroid.dislauncher.yml", aliases: true).fetch("Builds").first.fetch("commit")')"
          [[ "$RECIPE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Recipe commit must be a full 40-character SHA"; exit 1; }
          git fetch --no-tags origin "$RECIPE_COMMIT"
          git checkout --detach "$RECIPE_COMMIT"
          echo "commit=$RECIPE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Testing recipe commit: $RECIPE_COMMIT"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build the recipe's release variant
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$APK" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          if [[ ! -x "$AAPT" ]]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -u+x -print -quit)"
          fi
          if [[ -z "$AAPT" || ! -x "$AAPT" ]]; then
            echo "::error::Android SDK aapt executable was not found under $ANDROID_HOME/build-tools"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'aapt*' -print || true
            exit 1
          fi
          echo "Using Android build-tools executable: $AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.insomdroid.dislauncher' versionCode='103039999' versionName='1.3.3'"
          echo "Recipe source built successfully. APK is checked locally in this job and is not uploaded."
