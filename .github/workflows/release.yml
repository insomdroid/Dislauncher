name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to publish the APK to"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in the Android SDK
          # repository. Install only the packages required by this project.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build and verify production-signed APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
          : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"

          RELEASE_TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          if [[ ! "$RELEASE_TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          export RELEASE_STORE_FILE="$KEYSTORE_FILE"
          gradle assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          APK_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{print tolower($NF); exit}')"

          test -n "$EXPECTED_SHA256"
          test -n "$APK_SHA256"
          if [ "$EXPECTED_SHA256" != "$APK_SHA256" ]; then
            echo "APK certificate does not match the configured production keystore."
            echo "Expected SHA-256: $EXPECTED_SHA256"
            echo "APK SHA-256:      $APK_SHA256"
            exit 1
          fi

          cp "$APK" "Dislauncher-$RELEASE_TAG.apk"
          echo "Verified production-signed APK: Dislauncher-$RELEASE_TAG.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Dislauncher ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: Dislauncher-${{ inputs.release_tag || github.ref_name }}.apk
