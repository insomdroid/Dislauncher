name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic-version tag to build and publish (for example v1.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify production APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}

    steps:
      - name: Validate release tag
        id: validate
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            RELEASE_TAG="$REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a semantic-version tag such as v1.3.0; got: $RELEASE_TAG"
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if ! grep -Fq "## ${RELEASE_VERSION} |" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${RELEASE_VERSION}"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build and verify production-signed APK
        env:
          RELEASE_TAG_INPUT: ${{ steps.validate.outputs.release_tag }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
          : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"

          KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          export RELEASE_STORE_FILE="$KEYSTORE_FILE"

          ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          EXPECTED_VERSION="${RELEASE_TAG_INPUT#v}"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.insomdroid.dislauncher'"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='$EXPECTED_VERSION'"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'36'"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{gsub(":", "", $NF); print tolower($NF); exit}')"

          test -n "$EXPECTED_SHA256"
          test -n "$APK_CERT_SHA256"
          if [ "$EXPECTED_SHA256" != "$APK_CERT_SHA256" ]; then
            echo "::error::APK certificate does not match the configured production keystore."
            echo "Expected SHA-256: $EXPECTED_SHA256"
            echo "APK SHA-256:      $APK_CERT_SHA256"
            exit 1
          fi

          APK_NAME="Dislauncher-$RELEASE_TAG_INPUT.apk"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          sha256sum -c "$APK_NAME.sha256"
          echo "Verified package id, version, SDK levels, production signing certificate, and SHA-256 checksum: $APK_NAME"

      - name: Upload verified APK and checksum for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-files
          path: |
            Dislauncher-${{ steps.validate.outputs.release_tag }}.apk
            Dislauncher-${{ steps.validate.outputs.release_tag }}.apk.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-files
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Dislauncher ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-files/Dislauncher-${{ needs.build.outputs.release_tag }}.apk
            release-files/Dislauncher-${{ needs.build.outputs.release_tag }}.apk.sha256
          overwrite_files: true
