name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic-version tag to build and publish (for example v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            RELEASE_TAG="$REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic-version tag such as v1.2.0; got: $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build and verify production-signed APK
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
          : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"

          KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          export RELEASE_STORE_FILE="$KEYSTORE_FILE"

          ./gradlew lintRelease assembleRelease --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          APK_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{print tolower($NF); exit}')"

          test -n "$EXPECTED_SHA256"
          test -n "$APK_SHA256"
          if [ "$EXPECTED_SHA256" != "$APK_SHA256" ]; then
            echo "APK certificate does not match the configured production keystore."
            echo "Expected SHA-256: $EXPECTED_SHA256"
            echo "APK SHA-256:      $APK_SHA256"
            exit 1
          fi

          APK_NAME="Dislauncher-$RELEASE_TAG.apk"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "Verified production-signed APK and generated SHA-256 checksum: $APK_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Dislauncher ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            Dislauncher-${{ inputs.release_tag || github.ref_name }}.apk
            Dislauncher-${{ inputs.release_tag || github.ref_name }}.apk.sha256
          overwrite_files: true
