name: Dislauncher Nightly
# Run the complete required verification and produce an installable APK.

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'Screenshot/Minimalist Dislauncher Logo on Black.png'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'Screenshot/Minimalist Dislauncher Logo on Black.png'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nightly lint and build installable APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The build only needs the source snapshot. Fetch release tags separately
          # instead of downloading the complete Git history.
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --depth=1 origin '+refs/tags/v*:refs/tags/v*'

      - name: Resolve development version from latest stable release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="$((10#${BASH_REMATCH[3]} + 1))"
              version="${major}.${minor}.${patch}"
              echo "app_version_name=${version}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "Building development version ${version}-dev.${GITHUB_RUN_NUMBER}"
              exit 0
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          echo "::error::No stable semantic release tag found (expected a tag like v1.2.0)."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Normalize Android 17 SDK platform directory for AGP
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is not configured}}"
          PLATFORM_DIR="$SDK_ROOT/platforms/android-37.0"
          AGP_PLATFORM_DIR="$SDK_ROOT/platforms/android-37"
          test -d "$PLATFORM_DIR"
          if [[ ! -e "$AGP_PLATFORM_DIR" ]]; then
            ln -s "android-37.0" "$AGP_PLATFORM_DIR"
          fi
          test -d "$AGP_PLATFORM_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Lint and build APK
        env:
          APP_VERSION_NAME: "${{ steps.version.outputs.app_version_name }}"
          APP_BUILD_NUMBER: "${{ github.run_number }}"
          BUILD_EVENT_NAME: "${{ github.event_name }}"
          KEYSTORE: "${{ secrets.KEYSTORE }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        shell: bash
        run: |
          set -euo pipefail

          # PR and merge-queue builds cannot depend on production signing secrets.
          # They still run the same lint, APK assembly, and unit-test tasks.
          # Main-branch and manually dispatched builds use the production key.
          if [[ "$BUILD_EVENT_NAME" != "pull_request" && "$BUILD_EVENT_NAME" != "merge_group" ]]; then
            : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
            : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
            : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
            : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"
            KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            export RELEASE_STORE_FILE="$KEYSTORE_FILE"
          fi

          ./gradlew lintRelease assembleRelease testDebugUnitTest --stacktrace

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dislauncher-Lint-Diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-release.sarif
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload APK artifact
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dislauncher-Nightly-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
