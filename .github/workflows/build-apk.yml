name: Build APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Screenshot/dislauncher.png'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android lint and build upgrade-compatible APK
        env:
          APP_VERSION_NAME: "1.1.1-dev.${{ github.run_number }}"
          APP_BUILD_NUMBER: "${{ github.run_number }}"
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
          : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"

          KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          export RELEASE_STORE_FILE="$KEYSTORE_FILE"

          ./gradlew lintRelease assembleRelease --stacktrace

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dislauncher-test-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
