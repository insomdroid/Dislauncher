name: Dislauncher Nightly

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'Screenshot/Minimalist Dislauncher Logo on Black.png'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'Screenshot/Minimalist Dislauncher Logo on Black.png'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nightly lint and build installable APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve development version from latest stable release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="$((10#${BASH_REMATCH[3]} + 1))"
              version="${major}.${minor}.${patch}"
              echo "app_version_name=${version}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "Building development version ${version}-dev.${GITHUB_RUN_NUMBER}"
              exit 0
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          echo "::error::No stable semantic release tag found (expected a tag like v1.2.0)."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run Android lint and build APK
        env:
          APP_VERSION_NAME: "${{ steps.version.outputs.app_version_name }}"
          APP_BUILD_NUMBER: "${{ github.run_number }}"
          BUILD_EVENT_NAME: "${{ github.event_name }}"
          KEYSTORE: "${{ secrets.KEYSTORE }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        shell: bash
        run: |
          set -euo pipefail

          # PRs cannot access production secrets, so their APK is for CI only.
          # Main-branch builds use the release key to allow in-place APK updates.
          if [[ "$BUILD_EVENT_NAME" != "pull_request" ]]; then
            : "${KEYSTORE:?Missing GitHub secret KEYSTORE}"
            : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
            : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
            : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"
            KEYSTORE_FILE="$RUNNER_TEMP/dislauncher-release.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            export RELEASE_STORE_FILE="$KEYSTORE_FILE"
          fi

          ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Boot Android emulator for runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name dislauncher-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd dislauncher-ci \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/dislauncher-emulator.log" 2>&1 &
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 60); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/dislauncher-emulator.log"
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Android navigation and lifecycle smoke tests
        run: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Capture emulator runtime profile
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/runtime-profile
          if adb get-state >/dev/null 2>&1; then
            adb shell am force-stop com.insomdroid.dislauncher
            adb shell am start -n com.insomdroid.dislauncher/.MainActivity
            sleep 15
            adb shell dumpsys meminfo com.insomdroid.dislauncher > build/runtime-profile/meminfo.txt
            adb shell dumpsys gfxinfo com.insomdroid.dislauncher framestats > build/runtime-profile/gfxinfo-framestats.txt
            adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION|ANR in|Process: com\\.insomdroid\\.dislauncher' > build/runtime-profile/crash-signatures.txt
          fi
          if [[ -f "$RUNNER_TEMP/dislauncher-emulator.log" ]]; then
            cp "$RUNNER_TEMP/dislauncher-emulator.log" build/runtime-profile/emulator.log
          fi
          true

      - name: Upload emulator runtime profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dislauncher-Runtime-Profile-\${{ github.run_number }}
          path: build/runtime-profile/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dislauncher-Nightly-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
