name: Build APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android lint, unit tests, and build release APK
        run: gradle lintRelease testReleaseUnitTest assembleRelease

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "Generated APK (debug-signed):"
          ls -lh "$APK"
          echo "APK type:"
          file "$APK"

      - name: Upload installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dislauncher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
