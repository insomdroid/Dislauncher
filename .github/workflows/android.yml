name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download bundled open-source fonts
        run: |
          set -euo pipefail
          FONT_REVISION="66928797f271fed5ee428544e7229685e2d90127"
          mkdir -p app/src/main/res/font app/src/main/assets/fonts
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/$FONT_REVISION/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" \
            --output app/src/main/res/font/open_sans_regular.ttf
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/$FONT_REVISION/ofl/ralewaydots/RalewayDots-Regular.ttf" \
            --output app/src/main/res/font/raleway_dots_regular.ttf
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/$FONT_REVISION/ofl/opensans/OFL.txt" \
            --output app/src/main/assets/fonts/OFL-OpenSans.txt
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/$FONT_REVISION/ofl/ralewaydots/OFL.txt" \
            --output app/src/main/assets/fonts/OFL-RalewayDots.txt
          test -s app/src/main/res/font/open_sans_regular.ttf
          test -s app/src/main/res/font/raleway_dots_regular.ttf

      - name: Build release APK (debug-signed for CI)
        run: gradle assembleRelease

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "Generated APK (debug-signed):"
          ls -lh "$APK"
          echo "APK type:"
          file "$APK"

      - name: Upload installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dislauncher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
