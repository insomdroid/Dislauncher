name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_build_apk_runs:
        description: "Number of newest Build APK runs to keep"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "5"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove old completed workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Keep the newest Build APK runs and delete other completed runs
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = Number(core.getInput('keep_build_apk_runs') || '2');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            // Preserve the newest requested number of Build APK runs.
            const buildRuns = allRuns
              .filter(run => run.name === 'Build APK')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keepIds = new Set(buildRuns.slice(0, keepCount).map(run => run.id));

            // Never delete this cleanup run or any run that is still active.
            const deletable = allRuns.filter(run =>
              run.id !== currentRunId &&
              run.status === 'completed' &&
              !keepIds.has(run.id)
            );

            core.info(`Total runs found: ${allRuns.length}`);
            core.info(`Build APK runs preserved: ${Math.min(keepCount, buildRuns.length)}`);
            core.info(`Completed runs selected for deletion: ${deletable.length}`);

            let deleted = 0;
            for (const run of deletable) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run #${run.run_number} (${run.name}, ID ${run.id})`);
              } catch (error) {
                core.warning(`Could not delete run ID ${run.id}: ${error.message}`);
              }
            }

            core.notice(`Cleanup finished. Deleted ${deleted} completed runs; preserved ${Math.min(keepCount, buildRuns.length)} newest Build APK runs. Active runs were not touched.`);
