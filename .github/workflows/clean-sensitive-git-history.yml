name: Remove Sensitive Files from Git History

on:
  workflow_dispatch:
    inputs:
      confirm_api_key_revoked:
        description: "Confirm the potentially exposed OpenWeather key has been revoked/rotated"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write
  actions: read

jobs:
  rewrite-history:
    name: Back up and clean Git history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require key rotation before history rewrite
        if: inputs.confirm_api_key_revoked != 'yes'
        run: |
          echo "::error::Stop: revoke/rotate the potentially exposed OpenWeather API key first, then run this workflow and select yes."
          exit 1

      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all branches and tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git checkout --detach
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            git branch -f "$branch" "$ref"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

      - name: Create full-history backup bundle
        run: git bundle create "$RUNNER_TEMP/dislauncher-before-history-cleanup.bundle" --all

      - name: Store temporary private backup
        uses: actions/upload-artifact@v4
        with:
          name: dislauncher-git-history-backup-before-cleanup
          path: ${{ runner.temp }}/dislauncher-before-history-cleanup.bundle
          retention-days: 1
          if-no-files-found: error

      - name: Install git-filter-repo
        run: python -m pip install --user git-filter-repo

      - name: Remove flagged generated/export files from every commit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --force \
            --path-regex '(^|/)output\.js$' \
            --path 'Screenshot/aShellYou__20261017172957.txt' \
            --invert-paths

      - name: Push rewritten branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin --all
          git push --force origin --tags

      - name: Verify flagged paths are absent from current history
        run: |
          if git log --all --format= --name-only | grep -E '(^|/)output\.js$|^Screenshot/aShellYou__20261017172957\.txt$'; then
            echo "::error::A flagged file path remains in reachable history."
            exit 1
          fi
          echo "Flagged files are no longer reachable from rewritten branches and tags."
