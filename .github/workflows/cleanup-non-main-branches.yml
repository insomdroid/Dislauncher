name: One-time cleanup of non-main branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-non-main-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'audit: optimize Dislauncher and clean legacy branches [cleanup-once-20261014-0834]' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Delete all non-main branches and remove this one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          # Keep main; delete every other remote branch.
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if [ "$branch" != "main" ]; then
              echo "Deleting branch: $branch"
              git push origin --delete "$branch"
            fi
          done < <(git ls-remote --heads origin | sed -E 's#^[[:xdigit:]]+[[:space:]]+refs/heads/##')

          # Do not leave an elevated cleanup workflow in the repository.
          git rm .github/workflows/cleanup-non-main-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time branch cleanup workflow"
          git push origin HEAD:main

          # GITHUB_TOKEN pushes do not start regular push workflows.
          gh workflow run android.yml --ref main
