name: Compose Preview CLI Check

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/**'
      - 'app/src/debug/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/compose-preview-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/**'
      - 'app/src/debug/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/compose-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render Compose previews without emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Install official Android CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          if [[ -x "$HOME/.android/bin/android" ]]; then
            echo "$HOME/.android/bin" >> "$GITHUB_PATH"
          fi
          command -v android
          android --version

      - name: Discover Compose previews
        shell: bash
        run: |
          set -euo pipefail
          android preview list :app --format=json | tee preview-list.json
          grep -q 'ProgressLineLightPreview' preview-list.json
          grep -q 'ProgressLineDarkPreview' preview-list.json

      - name: Render Compose previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-output
          android preview render :app \
            --fqn=com.insomdroid.dislauncher.DeveloperPreviewsKt.ProgressLineLightPreview \
            --fqn=com.insomdroid.dislauncher.DeveloperPreviewsKt.ProgressLineDarkPreview \
            --component-tree \
            --output=preview-output
          find preview-output -maxdepth 2 -type f -print
          test "$(find preview-output -type f -name '*.png' | wc -l)" -ge 2

      - name: Upload rendered preview images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dislauncher-Compose-Previews-${{ github.run_number }}
          path: |
            preview-output/
            preview-list.json
          if-no-files-found: error
          retention-days: 3
