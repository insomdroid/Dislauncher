name: F-Droid Metadata Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/fdroiddata/metadata/com.insomdroid.dislauncher.yml'
      - '.github/workflows/fdroid-metadata-validation.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Validate with official fdroidserver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Dislauncher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official F-Droid metadata repository
        run: |
          git clone --depth=1 https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          cp docs/fdroiddata/metadata/com.insomdroid.dislauncher.yml "$RUNNER_TEMP/fdroiddata/metadata/com.insomdroid.dislauncher.yml"

      - name: Install official fdroidserver
        run: |
          git clone --depth=1 https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver"
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP/fdroidserver"

      - name: Parse metadata and run F-Droid lint
        working-directory: ${{ runner.temp }}/fdroiddata
        run: |
          fdroid readmeta
          fdroid lint com.insomdroid.dislauncher
