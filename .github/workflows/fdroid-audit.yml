name: F-Droid source audit

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'fastlane/metadata/android/en-US/**'
      - 'docs/fdroiddata/**'
      - '.github/workflows/fdroid-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: Resolve dependencies and validate metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Resolve runtime and compile dependencies (no APK build)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
          ./gradlew --no-daemon :app:dependencies --configuration releaseCompileClasspath >> dependency-report.txt

      - name: Generate third-party dependency license report (no APK build)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel :app:generateLicenseReport
          test -d app/build/reports/dependency-license
          find app/build/reports/dependency-license -maxdepth 1 -type f -print

      - name: Validate F-Droid source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          required = [
              root / "LICENSE",
              root / "fastlane/metadata/android/en-US/title.txt",
              root / "fastlane/metadata/android/en-US/short_description.txt",
              root / "fastlane/metadata/android/en-US/full_description.txt",
              root / "fastlane/metadata/android/en-US/images/icon.png",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          screenshots = sorted((root / "fastlane/metadata/android/en-US/images/phoneScreenshots").glob("*.png"))
          if missing:
              raise SystemExit("Missing required source metadata: " + ", ".join(missing))
          if not screenshots:
              raise SystemExit("No Fastlane phone screenshots found")

          short = (root / "fastlane/metadata/android/en-US/short_description.txt").read_text().strip()
          if len(short) > 80:
              raise SystemExit(f"Short description is {len(short)} characters; maximum is 80")
          if short.endswith("."):
              raise SystemExit("Short description must not end with a full stop")

          gradle = (root / "app/build.gradle.kts").read_text()
          code = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          if not code or not name:
              raise SystemExit("Literal defaultConfig versionCode/versionName not found")
          if code.group(1) != "103039999" or name.group(1) != "1.3.3":
              raise SystemExit(f"Unexpected F-Droid fallback version: {name.group(1)} / {code.group(1)}")

          print(f"Metadata checks passed; found {len(screenshots)} screenshots; fallback version {name.group(1)} ({code.group(1)}).")
          PY

      - name: Upload resolved dependency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fdroid-dependency-report
          path: |
            dependency-report.txt
            app/build/reports/dependency-license/**
          if-no-files-found: error
          retention-days: 14
