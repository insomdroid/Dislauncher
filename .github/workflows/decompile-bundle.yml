name: Decompile Hermes Bundle

on:
  push:
    paths:
      - ".github/workflows/decompile-bundle.yml"
      - "index.android.bundle"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Dislauncher
        uses: actions/checkout@v4

      - name: Checkout Hermes decompiler
        uses: actions/checkout@v4
        with:
          repository: SymbioticSec/hermes-decomp
          path: hermes-decomp

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Hermes decompiler
        working-directory: hermes-decomp
        run: cargo build --release -p hbc-decomp-cli

      - name: Verify bundle
        run: |
          test -s index.android.bundle
          file index.android.bundle
          ls -lh index.android.bundle

      - name: Decompile bundle
        run: |
          ./hermes-decomp/target/release/hermes-decomp info index.android.bundle
          ./hermes-decomp/target/release/hermes-decomp decompile index.android.bundle --deep -o output.js
          test -s output.js

      - name: Upload decompiled JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: dislauncher-decompiled-js
          path: output.js
          if-no-files-found: error
          retention-days: 7
