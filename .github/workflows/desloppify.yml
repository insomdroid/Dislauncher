name: Desloppify Code Health

on:
  push:
    branches:
      - main
    paths:
      - '.gitignore'
      - '.github/workflows/desloppify.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desloppify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan codebase quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install desloppify
        run: python -m pip install --upgrade "desloppify[full]"

      - name: Install Codex workflow skill
        run: desloppify update-skill codex

      - name: Exclude generated build output if present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d app/build ]]; then
            desloppify exclude app/build
          fi
          if [[ -d build ]]; then
            desloppify exclude build
          fi

      - name: Scan full repository
        run: desloppify scan --path .

      - name: Show next prioritized task
        run: desloppify next

      - name: Save scan state and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desloppify-report-${{ github.run_number }}
          path: |
            .desloppify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
