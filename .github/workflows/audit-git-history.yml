name: Audit Git History for Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-audit:
    name: Scan Complete Git History
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan all Git history
        run: gitleaks git . --redact --verbose
