Name: Dislauncher
Summary: A minimal, text-first Android launcher with useful built-in tools
Description: |
  Dislauncher is a lightweight, text-first Home screen for Android. It keeps
  your favourite apps and everyday tools easy to reach without making icons or
  visual effects the focus.

  Features:
  * A calm Home screen with time, date, useful information and favourite apps.
  * An app drawer with alphabetical browsing, favourites, folders, hidden apps
    and compatible icon packs.
  * Personalisation options for themes, accent colours, wallpaper, fonts and
    text size.
  * Built-in Notes with Markdown support, search, pinning, and import/export.
  * A monthly Calendar and daily agenda for local tasks, reminders and optional
    device calendar events.
  * A scientific Calculator and a Unit Converter.
  * Optional weather, music controls, notification dots, shortcuts and gestures.

  No account is required. Weather is optional and uses Open-Meteo when enabled.
  Notes, reminders and preferences are stored locally.
  Dislauncher is free and open source under the MIT License.

