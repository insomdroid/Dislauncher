<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="1600" viewBox="0 0 1240 1600">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#091310"/><stop offset="1" stop-color="#14211e"/></linearGradient><linearGradient id="accent"><stop stop-color="#9af5d0"/><stop offset="1" stop-color="#35c895"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="1240" height="1600" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#8be9c5">DISLAUNCHER</text>
<text x="90" y="195" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#f4fbf8">Designed around what matters.</text><text x="90" y="245" font-family="Arial,sans-serif" font-size="24" fill="#b7cbc6">A calmer Android experience, built around your daily essentials.</text>
<g filter="url(#shadow)"><rect x="90" y="320" width="500" height="700" rx="28" fill="#050909" stroke="#4d6d61" stroke-width="2"/><image x="110" y="340" width="460" height="660" preserveAspectRatio="xMidYMid meet" xlink:href="https://raw.githubusercontent.com/insomdroid/Dislauncher/main/Screenshot/Screenshot_20261022-221233_Dislauncher.png"/></g>
<g><text x="650" y="395" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#8be9c5">01 / YOUR HOME</text><text x="650" y="450" font-family="Arial,sans-serif" font-size="26" fill="#f4fbf8">A focused home screen</text><text x="650" y="495" font-family="Arial,sans-serif" font-size="20" fill="#b7cbc6">Keep time, progress, and favorite</text><text x="650" y="525" font-family="Arial,sans-serif" font-size="20" fill="#b7cbc6">apps close at hand.</text></g>
<g filter="url(#shadow)"><rect x="650" y="610" width="500" height="700" rx="28" fill="#050909" stroke="#4d6d61" stroke-width="2"/><image x="670" y="630" width="460" height="660" preserveAspectRatio="xMidYMid meet" xlink:href="https://raw.githubusercontent.com/insomdroid/Dislauncher/main/Screenshot/Screenshot_20261022-221343_Dislauncher.png"/></g>
<g><text x="90" y="1110" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#8be9c5">02 / YOUR EXPERIENCE</text><text x="90" y="1165" font-family="Arial,sans-serif" font-size="25" fill="#f4fbf8">Minimal interface. Thoughtful details.</text><text x="90" y="1210" font-family="Arial,sans-serif" font-size="20" fill="#b7cbc6">A text-first approach keeps your launcher clean and easy to scan.</text></g>
<text x="620" y="1450" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f4fbf8">Less distraction. More intention.</text><text x="620" y="1500" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7d9890">PROMOTIONAL CONCEPT • Original screenshots, English copy</text></svg>